<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Doge Shiba Inu Transparent Sticker -->
  <defs>
    <filter id="doge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>
  <g filter="url(#doge-shadow)">
    <!-- White Sticker Outline -->
    <ellipse cx="100" cy="108" rx="72" ry="65" fill="#ffffff" stroke="#e2e8f0" stroke-width="5" />
    <!-- Doge Face Fur -->
    <ellipse cx="100" cy="108" rx="68" ry="60" fill="#e0a353" />
    <!-- White Muzzle / Cheeks -->
    <ellipse cx="100" cy="125" rx="44" ry="34" fill="#fdfbf7" />
    <path d="M 68 110 C 60 70, 75 40, 95 65" fill="#fdfbf7" />
    <path d="M 132 110 C 140 70, 125 40, 105 65" fill="#fdfbf7" />
    <!-- Pointy Shiba Ears -->
    <polygon points="50,68 35,28 72,42" fill="#d9933b" stroke="#ffffff" stroke-width="3" />
    <polygon points="48,60 42,36 62,45" fill="#f472b6" opacity="0.6" />
    <polygon points="150,68 165,28 128,42" fill="#d9933b" stroke="#ffffff" stroke-width="3" />
    <polygon points="152,60 158,36 138,45" fill="#f472b6" opacity="0.6" />
    <!-- Suspicious / Iconic Doge Side-Eye Gaze -->
    <ellipse cx="74" cy="92" rx="9" ry="11" fill="#1e293b" />
    <circle cx="71" cy="88" r="3.5" fill="#ffffff" />
    <ellipse cx="126" cy="92" rx="9" ry="11" fill="#1e293b" />
    <circle cx="123" cy="88" r="3.5" fill="#ffffff" />
    <!-- Raised Worried / Judging Eyebrows -->
    <path d="M 64 76 Q 74 72 84 76" stroke="#92400e" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 116 76 Q 126 72 136 76" stroke="#92400e" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Black Nose & Cute Mouth -->
    <polygon points="94,115 106,115 100,124" fill="#1e293b" />
    <path d="M 92 128 Q 100 132 108 128" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Classic Doge Caption: "much wow" -->
    <text x="18" y="42" font-family="'Comic Sans MS', sans-serif" font-weight="bold" font-size="14" fill="#ec4899">wow</text>
    <text x="135" y="168" font-family="'Comic Sans MS', sans-serif" font-weight="bold" font-size="13" fill="#06b6d4">much happy</text>
  </g>
</svg>
