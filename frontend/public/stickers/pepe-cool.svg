<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cool Pepe Animated Deal With It Sticker -->
  <defs>
    <filter id="pepe-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>

  <style>
    @keyframes glassesDrop {
      0% { transform: translateY(-70px); opacity: 0; }
      40% { transform: translateY(0); opacity: 1; }
      48% { transform: translateY(-4px); }
      55% { transform: translateY(0); }
      85% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-70px); opacity: 0; }
    }
    @keyframes gleamFlash {
      0%, 50% { opacity: 0; transform: scale(0.4) rotate(0deg); }
      60% { opacity: 1; transform: scale(1.3) rotate(45deg); }
      70% { opacity: 0; transform: scale(0.6) rotate(90deg); }
      100% { opacity: 0; }
    }
    @keyframes pepeSway {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .pepe-head {
      transform-origin: 100px 140px;
      animation: pepeSway 2.2s ease-in-out infinite;
    }
    .deal-with-it-glasses {
      transform-origin: 100px 75px;
      animation: glassesDrop 3s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .glass-gleam {
      transform-origin: 145px 72px;
      animation: gleamFlash 3s ease-in-out infinite;
    }
  </style>

  <g filter="url(#pepe-shadow)" class="pepe-head">
    <!-- White Die-Cut Border -->
    <path d="M 35 155 C 22 135, 20 85, 38 52 C 55 24, 142 22, 162 50 C 180 80, 178 135, 165 155 C 145 178, 55 178, 35 155 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="5" stroke-linejoin="round" />
    <!-- Green Pepe Skin -->
    <path d="M 40 150 C 28 132, 26 88, 42 58 C 58 32, 138 30, 158 56 C 174 84, 172 132, 160 150 C 142 172, 58 172, 40 150 Z" fill="#699f4c" />

    <!-- Pepe Bulging Eyes (underneath glasses) -->
    <ellipse cx="68" cy="74" rx="20" ry="16" fill="#ffffff" stroke="#3e632b" stroke-width="2" />
    <circle cx="72" cy="74" r="6" fill="#1e293b" />
    <ellipse cx="132" cy="74" rx="20" ry="16" fill="#ffffff" stroke="#3e632b" stroke-width="2" />
    <circle cx="128" cy="74" r="6" fill="#1e293b" />

    <!-- Iconic Pepe Thick Red Lips -->
    <path d="M 46 112 C 70 128, 128 128, 154 112 C 160 125, 145 146, 126 150 C 95 155, 65 150, 46 112 Z" fill="#c0392b" stroke="#78281f" stroke-width="2.5" />
    <path d="M 52 116 C 75 124, 122 124, 146 116" stroke="#e74c3c" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Smug Nostrils -->
    <ellipse cx="88" cy="104" rx="3.5" ry="2.5" fill="#466d33" />
    <ellipse cx="112" cy="104" rx="3.5" ry="2.5" fill="#466d33" />

    <!-- Animated Sunglasses (Deal With It) -->
    <g class="deal-with-it-glasses">
      <!-- Left Lens -->
      <polygon points="36,62 96,62 90,92 44,92" fill="#111827" stroke="#000000" stroke-width="2.5" />
      <!-- Right Lens -->
      <polygon points="104,62 164,62 156,92 110,92" fill="#111827" stroke="#000000" stroke-width="2.5" />
      <!-- Sunglasses Bridge -->
      <rect x="94" y="64" width="12" height="6" fill="#111827" />
      <!-- White Glare Lines -->
      <polygon points="46,65 54,65 44,87 38,87" fill="#ffffff" opacity="0.6" />
      <polygon points="114,65 122,65 112,87 106,87" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Star Gleam Flash on Sunglasses -->
    <g class="glass-gleam">
      <polygon points="145,66 148,72 154,73 149,78 151,84 145,81 139,84 141,78 136,73 142,72" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" />
    </g>
  </g>
</svg>
