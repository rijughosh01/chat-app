<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Anya Forger "Heh" Smug Transparent Sticker -->
  <defs>
    <filter id="anya-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.18" />
    </filter>
  </defs>
  <g filter="url(#anya-shadow)">
    <!-- White Sticker Outline -->
    <path d="M 40 160 C 25 120, 30 70, 52 40 C 70 20, 130 20, 148 40 C 170 70, 175 120, 160 160 C 145 178, 55 178, 40 160 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="5" stroke-linejoin="round" />
    <!-- Pink Hair -->
    <path d="M 45 155 C 32 118, 36 72, 56 46 C 72 26, 128 26, 144 46 C 164 72, 168 118, 155 155 C 138 120, 135 90, 135 85 C 120 70, 80 70, 65 85 C 65 90, 62 120, 45 155 Z" fill="#f472b6" />
    <!-- Black Cone Hair Ornaments -->
    <polygon points="46,45 32,25 58,32" fill="#1e293b" stroke="#facc15" stroke-width="2" />
    <polygon points="154,45 168,25 142,32" fill="#1e293b" stroke="#facc15" stroke-width="2" />
    <!-- Face Base (Pale Anime Skin) -->
    <ellipse cx="100" cy="112" rx="46" ry="42" fill="#ffedd5" />
    <!-- Bangs -->
    <path d="M 58 75 Q 80 95 90 82 Q 105 95 120 80 Q 135 95 142 75 C 125 65, 75 65, 58 75 Z" fill="#f472b6" />
    <!-- Smug Slanted Eyes ("Heh" Expression) -->
    <!-- Left Eye -->
    <path d="M 68 106 Q 80 96 92 104" stroke="#1e293b" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <ellipse cx="80" cy="108" rx="6" ry="4" fill="#047857" />
    <ellipse cx="80" cy="108" rx="3" ry="2" fill="#1e293b" />
    <!-- Right Eye -->
    <path d="M 108 104 Q 120 96 132 106" stroke="#1e293b" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <ellipse cx="120" cy="108" rx="6" ry="4" fill="#047857" />
    <ellipse cx="120" cy="108" rx="3" ry="2" fill="#1e293b" />
    <!-- Smug Rosy Cheeks -->
    <ellipse cx="68" cy="120" rx="9" ry="5" fill="#fb7185" opacity="0.6" />
    <ellipse cx="132" cy="120" rx="9" ry="5" fill="#fb7185" opacity="0.6" />
    <!-- Iconic Asymmetric Smug Grin -->
    <path d="M 85 132 Q 98 126 116 136" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 112 134 Q 118 138 116 132" stroke="#1e293b" stroke-width="2.5" fill="none" />
    <!-- "heh" text -->
    <text x="136" y="85" font-family="sans-serif" font-weight="900" font-size="16" fill="#be185d">heh 𓁹‿𓁹</text>
  </g>
</svg>
