<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Animated Pack High-Visibility Tab Icon (Sticker Badge + Glowing Lightning) -->
  <defs>
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .lightning-pulse {
      animation: boltFlash 1.6s ease-in-out infinite alternate;
      transform-origin: 50px 50px;
    }
    @keyframes boltFlash {
      0% { transform: scale(0.92); filter: drop-shadow(0 0 2px #f59e0b); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 8px #fef08a); }
      100% { transform: scale(0.92); filter: drop-shadow(0 0 2px #f59e0b); }
    }
    .sparkle-pop {
      animation: sparkleTwinkle 1.2s ease-in-out infinite alternate;
    }
    @keyframes sparkleTwinkle {
      0% { opacity: 0.3; transform: scale(0.6); }
      100% { opacity: 1; transform: scale(1.2); }
    }
  </style>

  <g filter="url(#badge-shadow)">
    <!-- WhatsApp Peeling Sticker Shield Shape -->
    <path d="M 22 12 L 72 12 Q 88 12 88 28 L 88 64 L 68 88 L 22 88 Q 12 88 12 78 L 12 28 Q 12 12 22 12 Z" fill="url(#badge-bg)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

    <!-- Peeled Corner -->
    <path d="M 88 64 L 68 64 Q 68 88 68 88 Z" fill="#047857" opacity="0.6" />
    <path d="M 88 64 L 68 64 L 68 88 Z" fill="#34d399" opacity="0.9" stroke="#ffffff" stroke-width="2" />

    <!-- Animated Lightning Bolt -->
    <g class="lightning-pulse">
      <polygon points="56,22 34,50 48,50 42,78 68,44 54,44" fill="url(#bolt-grad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
    </g>

    <!-- Sparkle Stars -->
    <path class="sparkle-pop" style="transform-origin: 26px 28px;" d="M26 23 L28 27 L32 28 L28 29 L26 33 L24 29 L20 28 L24 27 Z" fill="#ffffff" />
    <path class="sparkle-pop" style="transform-origin: 78px 32px; animation-delay: 0.6s;" d="M78 28 L79.5 31 L82 32 L79.5 33 L78 36 L76.5 33 L74 32 L76.5 31 Z" fill="#fef08a" />
  </g>
</svg>
