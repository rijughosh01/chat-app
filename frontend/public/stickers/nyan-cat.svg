<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Nyan Cat Animated Rainbow Sticker -->
  <defs>
    <filter id="nyan-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.18" />
    </filter>
  </defs>

  <style>
    @keyframes nyanBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes rainbowWave {
      0% { transform: translateY(0); }
      50% { transform: translateY(4px); }
      100% { transform: translateY(0); }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.6); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .nyan-group {
      transform-origin: 120px 100px;
      animation: nyanBob 0.32s ease-in-out infinite;
    }
    .rainbow-track {
      animation: rainbowWave 0.32s ease-in-out infinite;
    }
    .star-1 { transform-origin: 160px 40px; animation: starTwinkle 0.8s ease-in-out infinite; }
    .star-2 { transform-origin: 40px 50px; animation: starTwinkle 0.8s ease-in-out 0.4s infinite; }
    .star-3 { transform-origin: 170px 150px; animation: starTwinkle 0.8s ease-in-out 0.2s infinite; }
  </style>

  <g filter="url(#nyan-shadow)">
    <!-- Animated Rainbow Trail Behind -->
    <g class="rainbow-track">
      <!-- 6 Rainbow Bands -->
      <path d="M 10 74 Q 45 68 80 74 L 80 82 Q 45 76 10 82 Z" fill="#ef4444" />
      <path d="M 10 82 Q 45 76 80 82 L 80 90 Q 45 84 10 90 Z" fill="#f97316" />
      <path d="M 10 90 Q 45 84 80 90 L 80 98 Q 45 92 10 98 Z" fill="#eab308" />
      <path d="M 10 98 Q 45 92 80 98 L 80 106 Q 45 100 10 106 Z" fill="#22c55e" />
      <path d="M 10 106 Q 45 100 80 106 L 80 114 Q 45 108 10 114 Z" fill="#06b6d4" />
      <path d="M 10 114 Q 45 108 80 114 L 80 122 Q 45 116 10 122 Z" fill="#a855f7" />
    </g>

    <!-- Twinkling Sparkle Stars -->
    <text x="155" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#ffffff" stroke="#facc15" stroke-width="1" class="star-1">✦</text>
    <text x="35" y="55" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" stroke="#38bdf8" stroke-width="1" class="star-2">✦</text>
    <text x="165" y="155" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#ffffff" stroke="#ec4899" stroke-width="1" class="star-3">✦</text>

    <!-- Nyan Cat Group -->
    <g class="nyan-group">
      <!-- Outer White Outline -->
      <rect x="74" y="66" width="68" height="56" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="5" />

      <!-- Pop-Tart Pastry Body -->
      <rect x="76" y="68" width="64" height="52" rx="12" fill="#fed7aa" stroke="#ca8a04" stroke-width="2" />
      <!-- Pink Frosting -->
      <rect x="82" y="74" width="52" height="40" rx="8" fill="#f472b6" />
      <!-- Sprinkles -->
      <circle cx="90" cy="82" r="2" fill="#ef4444" />
      <circle cx="106" cy="80" r="2" fill="#3b82f6" />
      <circle cx="122" cy="85" r="2" fill="#22c55e" />
      <circle cx="95" cy="98" r="2" fill="#a855f7" />
      <circle cx="114" cy="96" r="2" fill="#facc15" />
      <circle cx="125" cy="102" r="2" fill="#ef4444" />

      <!-- Grey Cat Tail (behind) -->
      <path d="M 76 102 Q 60 98 62 88 Q 66 84 72 94" fill="#94a3b8" stroke="#475569" stroke-width="2" />

      <!-- Grey Cat Head -->
      <circle cx="140" cy="94" r="20" fill="#94a3b8" stroke="#475569" stroke-width="2" />
      <!-- Cat Ears -->
      <polygon points="128,78 134,64 142,76" fill="#94a3b8" stroke="#475569" stroke-width="2" />
      <polygon points="144,76 152,64 156,78" fill="#94a3b8" stroke="#475569" stroke-width="2" />

      <!-- Cheerful Face -->
      <circle cx="134" cy="92" r="3.5" fill="#1e293b" />
      <circle cx="135" cy="90" r="1" fill="#ffffff" />
      <circle cx="148" cy="92" r="3.5" fill="#1e293b" />
      <circle cx="149" cy="90" r="1" fill="#ffffff" />
      <!-- Small Cat Nose & Smile -->
      <circle cx="141" cy="97" r="1.5" fill="#1e293b" />
      <path d="M 137 100 Q 141 104 145 100" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" />
      <!-- Rosy Cheeks -->
      <circle cx="128" cy="98" r="3" fill="#f43f5e" />
      <circle cx="152" cy="98" r="3" fill="#f43f5e" />

      <!-- Cute Little Paws -->
      <ellipse cx="94" cy="122" rx="6" ry="4" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
      <ellipse cx="126" cy="122" rx="6" ry="4" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
    </g>
  </g>
</svg>
