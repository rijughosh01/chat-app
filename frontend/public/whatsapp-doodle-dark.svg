<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" fill="none">
  <!-- WhatsApp Iconic Doodle Wallpaper Pattern (Dark Mode) -->
  <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.065">
    
    <!-- 1. Speech Bubble with Dots -->
    <g transform="translate(30, 30) rotate(-8)">
      <path d="M4 14a10 10 0 0 1 10-10h14a10 10 0 0 1 10 10v6a10 10 0 0 1-10 10H16l-8 6v-6a10 10 0 0 1-4-6v-4z" />
      <circle cx="15" cy="14" r="1.5" fill="#ffffff" />
      <circle cx="21" cy="14" r="1.5" fill="#ffffff" />
      <circle cx="27" cy="14" r="1.5" fill="#ffffff" />
    </g>

    <!-- 2. Retro Camera -->
    <g transform="translate(130, 25) rotate(6)">
      <rect x="4" y="8" width="28" height="20" rx="4" />
      <path d="M12 8l2-4h8l2 4" />
      <circle cx="18" cy="18" r="5" />
      <circle cx="27" cy="12" r="1.5" fill="#ffffff" />
    </g>

    <!-- 3. Coffee Mug with Steam -->
    <g transform="translate(230, 28) rotate(-4)">
      <path d="M6 10h20v14a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6V10z" />
      <path d="M26 13h3a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3h-3" />
      <path d="M11 4c0 2-2 2-2 4" />
      <path d="M16 3c0 2-2 2-2 4" />
      <path d="M21 4c0 2-2 2-2 4" />
    </g>

    <!-- 4. Heart with Sparkles -->
    <g transform="translate(325, 30) rotate(12)">
      <path d="M16 28s-11-7.5-11-15a6 6 0 0 1 11-3.5A6 6 0 0 1 27 13c0 7.5-11 15-11 15z" />
      <path d="M28 6l1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2z" fill="#ffffff" />
    </g>

    <!-- 5. Music Notes -->
    <g transform="translate(385, 35) rotate(-10)">
      <path d="M9 18V5l12-3v13" />
      <circle cx="6" cy="18" r="3" fill="#ffffff" />
