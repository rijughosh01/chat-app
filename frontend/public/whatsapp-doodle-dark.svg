    <!-- 23. Trophy / Award -->
    <g transform="translate(325, 375) rotate(5)">
      <path d="M10 6h14v10a7 7 0 0 1-14 0V6z" />
      <path d="M6 8h4v4a4 4 0 0 1-4-4z" />
      <path d="M24 8h4a4 4 0 0 1-4 4V8z" />
      <path d="M17 16v6m-5 4h10" />
