    <!-- Subtle filler dots and sparkles to create seamless density -->
    <circle cx="95" cy="70" r="1.5" fill="#ffffff" />
    <circle cx="190" cy="80" r="1.5" fill="#ffffff" />
    <circle cx="290" cy="75" r="1.5" fill="#ffffff" />
    <circle cx="365" cy="90" r="1.5" fill="#ffffff" />
    <circle cx="85" cy="175" r="1.5" fill="#ffffff" />
    <circle cx="180" cy="165" r="1.5" fill="#ffffff" />
    <circle cx="280" cy="170" r="1.5" fill="#ffffff" />
    <circle cx="370" cy="160" r="1.5" fill="#ffffff" />
    <circle cx="90" cy="260" r="1.5" fill="#ffffff" />
    <circle cx="185" cy="255" r="1.5" fill="#ffffff" />
    <circle cx="275" cy="260" r="1.5" fill="#ffffff" />
    <circle cx="365" cy="265" r="1.5" fill="#ffffff" />
    <circle cx="95" cy="345" r="1.5" fill="#ffffff" />
    <circle cx="190" cy="340" r="1.5" fill="#ffffff" />
    <circle cx="285" cy="345" r="1.5" fill="#ffffff" />
    <circle cx="375" cy="350" r="1.5" fill="#ffffff" />

    <!-- Small cross stars -->
    <path d="M85 240v6m-3-3h6" />
    <path d="M195 110v5m-2.5-2.5h5" />
    <path d="M295 240v5m-2.5-2.5h5" />
    <path d="M380 115v6m-3-3h6" />
