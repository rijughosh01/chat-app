    <!-- 21. Key -->
    <g transform="translate(135, 375) rotate(15)">
      <circle cx="10" cy="10" r="6" />
      <line x1="15" y1="13" x2="26" y2="24" />
      <line x1="22" y1="20" x2="24" y2="18" />
      <line x1="24" y1="22" x2="27" y2="19" />
