    <g transform="translate(385, 215) rotate(-8)">
      <rect x="6" y="10" width="22" height="18" rx="2" />
      <rect x="4" y="6" width="26" height="5" rx="1.5" />
      <line x1="17" y1="6" x2="17" y2="28" />
      <path d="M17 6c-2-3-6-3-6 0s6 0 6 0z" />
